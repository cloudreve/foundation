name: Foundation CI
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.11
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: mise exec -- bun install --frozen-lockfile --ignore-scripts
      - run: mise run check
      - run: mise run package:check
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-${{ runner.os }}
          include-hidden-files: true
          path: |
            .artifacts/packages/*.tgz
            .artifacts/packages/*.sha256
            .artifacts/packages/manifest.json
            coverage/coverage-summary.json
          if-no-files-found: error
